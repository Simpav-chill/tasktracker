services:
  tasktracker_db:
    image: postgres:16
    restart: always

    environment:
      POSTGRES_DB: tasktracker
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: